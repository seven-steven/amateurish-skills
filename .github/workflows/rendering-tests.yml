name: rendering tests

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "skill/scripts/**"
      - "skill/themes/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - ".github/workflows/rendering-tests.yml"
  pull_request:
    paths:
      - "engine/**"
      - "skill/scripts/**"
      - "skill/themes/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - ".github/workflows/rendering-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20.0"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test CLI output and browser rendering
        run: npm test
      - name: Upload browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendering-test-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
